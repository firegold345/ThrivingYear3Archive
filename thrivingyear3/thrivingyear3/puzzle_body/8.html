    <style>
    /* 核心响应式逻辑 */
    .center-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 10px 0;
        box-sizing: border-box;
    }

    .grid-container {
        display: inline-block;
        /* 12列，每列最大80px，最小随屏幕宽度自适应 */
        width: 100%;
        max-width: 960px; /* 80px * 12 */
        border: 1px solid #333;
        background-color: #fff;
    }

    .grid-row {
        display: flex;
        width: 100%;
    }

    .grid-cell {
        /* 关键：使用 vw 单位确保 12 个格子永远在一行内，不会溢出 */
        width: calc(100% / 12);
        /* 保持正方形 */
        aspect-ratio: 1 / 1;
        border: 0.5px solid #333;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        word-break: break-all;
        overflow: hidden;
        /* 字体大小随屏幕缩放，最小 10px，最大 14px */
        font-size: clamp(10px, 1.5vw, 14px);
        padding: 2px;
        line-height: 1.1;
        color: #000;
    }

    /* 黑色格子覆盖样式 */
    .grid-cell[style*="background-color:black"],
    .grid-cell[style*="background-color: black"] {
        background-color: #222 !important;
    }

    /* 底部文字样式 */
    .footer-info {
        text-align: center;
        margin-top: 20px;
        font-size: 16px;
        width: 90%;
    }
    .footer-info a {
        color: #0066cc;
        word-break: break-all;
    }
</style>
</head>
